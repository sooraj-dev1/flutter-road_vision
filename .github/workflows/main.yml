name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    name: Build and Test Flutter
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (standard for modern Flutter/Gradle)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Check Flutter environment details
      - name: Verify Flutter installation
        run: flutter doctor -v

      # 5. Fetch project dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Analyze code (won't kill the build if there are minor linter warnings)
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # 7. Run tests only if a test directory exists (prevents crashing if no tests are written)
      - name: Run unit and widget tests
        run: |
          if [ -d "test" ] && [ "$(ls -A test)" ]; then
            flutter test
          else
            echo "No tests found in ./test folder. Skipping test step."
          fi
        continue-on-error: true

      # 8. Build unsigned release APK
      - name: Build Android APK
        run: flutter build apk --debug

      # 9. Upload the generated APK as an artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
