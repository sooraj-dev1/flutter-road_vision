name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Fetch project dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Check code formatting and static analysis
      - name: Analyze project
        run: flutter analyze

      # 6. Run unit tests
      - name: Run unit tests
        run: flutter test

      # 7. Build the release APK
      - name: Build Android APK
        run: flutter build apk --release

      # 8. (Optional) Upload the built APK as a downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
