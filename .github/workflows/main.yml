name: Road Vision CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (Required for Android)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Create .env file from GitHub Secrets
      # This is crucial if your app reads from .env
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 5. Setup Google Services (Firebase)
      # If your android/app/google-services.json is required for build, use this:
      - name: Setup Google Services
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      # 6. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Run Analyze
      - name: Run Flutter Analyze
        run: flutter analyze
        # This will fail the build if there are code errors (recommended)

      # 8. Run Tests
      - name: Run Tests
        run: flutter test

      # 9. Build APK
      - name: Build APK
        run: flutter build apk --debug
